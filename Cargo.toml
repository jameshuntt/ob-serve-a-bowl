[package]
name = "ob-serve-a-bowl"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Observable wake runtime: a bit-packed wake key for hot-path routing, cold observers declared as field masks, profile-selected wake delivery, and a replayable event log."
authors = ["James Hunt"]
repository = "https://github.com/jameshuntt/ob-serve-a-bowl"
readme = "README.md"
keywords = ["observable", "wake", "scheduler", "event-log", "runtime"]
categories = ["concurrency", "asynchronous"]

[features]
default = []
crossbeam-wake = ["dep:crossbeam-channel"]
serialization = ["dep:serde", "dep:serde_json"]
protocol = ["dep:waker_protocol"]
tagged-payloads = ["dep:petr-core", "dep:petr-collections", "dep:thiserror"]
loom-tests = []

[dependencies]
big-bad-bool = "0.1"
big-bad-bool-interact = "0.1"
crossbeam-channel = { version = "0.5", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
waker_protocol = { version = "0.2", optional = true }
petr-core = { version = "0.1", optional = true }
petr-collections = { version = "0.1", optional = true }
thiserror = { version = "1", optional = true }

# loom checks the wake/epoch protocol's concurrent memory ordering. Only present
# under `--cfg loom`; the normal build and tests use std atomics.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[example]]
name = "tagged_payload_observable"
required-features = ["tagged-payloads"]

[[example]]
name = "server_event_observable"
required-features = ["protocol", "serialization", "tagged-payloads"]

[[bench]]
name = "observable_runtime_benches"
harness = false
