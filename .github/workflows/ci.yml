name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly: the newest compatible dependency versions, which is what a new user of the crate gets.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --all-features --all-targets --locked
      - run: cargo test --all-features --doc --locked
      - run: cargo clippy --all-features --all-targets --locked -- -D warnings
      - name: No features, then each feature on its own
        run: |
          cargo clippy --no-default-features --all-targets --locked -- -D warnings
          cargo test --no-default-features --all-targets --locked
          for f in crossbeam-wake serialization protocol tagged-payloads; do
            cargo clippy --no-default-features --features "$f" --all-targets --locked -- -D warnings || exit 1
            cargo test --no-default-features --features "$f" --all-targets --locked || exit 1
          done
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Run every example
        run: for e in examples/*.rs; do cargo run --all-features --locked --example "$(basename "$e" .rs)" || exit 1; done
      - run: cargo bench --no-run --all-features --locked
      - name: Build the package exactly as publish would
        run: cargo package --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo test --all-features --all-targets --locked
      - run: cargo test --no-default-features --all-targets --locked

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri setup
      - run: scripts/miri_gate.sh

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: scripts/loom_gate.sh
      - run: cargo clippy --all-features --lib --tests --locked -- -D warnings
        env:
          RUSTFLAGS: --cfg loom

  latest-deps:
    # Not a publish gate: a third-party release should not block a tag, but it should show up here.
    if: github.event_name == 'schedule' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.88"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo update
      - run: cargo test --all-features --all-targets

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv, miri, loom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Pinned to commits: this job can get a crates.io token. The runner's own stable cargo is used.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
