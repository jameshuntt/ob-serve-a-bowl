name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --all-features --all-targets --locked
      - run: cargo test --all-features --doc --locked
      - name: Each feature on its own
        run: |
          cargo test --no-default-features --locked
          for f in crossbeam-wake serialization protocol tagged-payloads loom-tests; do
            cargo test --no-default-features --features "$f" --locked || exit 1
          done
      - run: cargo clippy --all-features --all-targets --locked -- -D warnings
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Run every example
        run: for e in examples/*.rs; do cargo run --all-features --locked --example "$(basename "$e" .rs)" || exit 1; done
      - run: cargo bench --no-run --all-features --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo test --all-features --all-targets --locked

  miri:
    runs-on: ubuntu-latest
    env:
      # Some tests read the clock and write temp files, which Miri allows only without isolation.
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: cargo miri test --all-features --locked
      - name: Every example under Miri
        run: for e in examples/*.rs; do cargo miri run --all-features --locked --example "$(basename "$e" .rs)" || exit 1; done

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/loom_gate.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv, miri, loom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
